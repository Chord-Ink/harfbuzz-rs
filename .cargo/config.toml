# Toolchain for this workspace.
#
# HarfBuzz is C++, so `harfbuzz-sys/build.rs` drives `cc::Build::cpp(true)`,
# which reads CXX rather than CC. CC is set alongside it for anything that
# compiles C.
#
# Pointing both at an upstream LLVM install — rather than the Xcode one — is
# what makes cross-language LTO available: bitcode can only be read by an LLVM
# at least as new as the one that produced it, and `rustc` embeds its own. Keep
# this in step with `rustc -vV`'s "LLVM version" line.

[env]
CC = "/Users/ares/Developer/SDK/llvm/toolchains/22.1.2/darwin-aarch64/bin/clang"
CXX = "/Users/ares/Developer/SDK/llvm/toolchains/22.1.2/darwin-aarch64/bin/clang++"
# AR and NM must come from the same toolchain: under -Clinker-plugin-lto the
# object files are LLVM bitcode, which a plain ar cannot index and a plain nm
# cannot read.
AR = "/Users/ares/Developer/SDK/llvm/toolchains/22.1.2/darwin-aarch64/bin/llvm-ar"
NM = "/Users/ares/Developer/SDK/llvm/toolchains/22.1.2/darwin-aarch64/bin/llvm-nm"
# Apple's clang knows where the SDK is; a standalone LLVM clang does not, and
# fails on the first system header. Clang reads SDKROOT natively. The path is
# version-independent, so it survives Xcode updates.
SDKROOT = "/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"

# Cross-language LTO is opt-in and is NOT enabled here.
#
# `-Clinker-plugin-lto` makes `rustc` emit LLVM bitcode instead of machine code.
# `build.rs` watches for it in CARGO_ENCODED_RUSTFLAGS and adds `-flto` to the
# HarfBuzz compile to match, so both halves reach the linker as bitcode and can
# be optimized together. That half works today: with CXX set above, the archive
# comes out as LLVM bitcode.
#
# The LINK does not, on this target. `rustc` translates
# `-Clinker-plugin-lto` into `-Wl,-plugin-opt=...`, which is GNU-linker syntax;
# no Mach-O linker accepts it, and both Apple's `ld` and `ld64.lld` fail with
#
#     ld: unknown options: -plugin-opt=O0 -plugin-opt=mcpu=apple-m1
#
# So cross-language LTO is reachable on ELF targets but blocked on
# aarch64-apple-darwin by rustc itself, not by anything in this crate. Nothing
# here needs to change if that is fixed upstream.
#
# One further trap when you do enable it: `rustflags` also applies to build
# scripts, whose host binary hits the same failure. Passing `--target` explicitly
# keeps build scripts out of the target's flags.
#
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-Clinker-plugin-lto", "-Clink-arg=-fuse-ld=lld"]
